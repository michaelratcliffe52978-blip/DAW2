<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Await/fetch</title>
</head>
<body>


  <script>
   // Hacer una petición GET con fetch
fetch("https://jsonplaceholder.typicode.com/users")
  .then(response => {
    // El objeto Response no contiene directamente los datos parseados (como JSON o texto), 
    // sino que representa la respuesta HTTP completa.
    if (!response.ok) {
      throw new Error("Error en la petición: " + response.status);
    }
    // Convertir la respuesta a JSON
    return response.json();
  })
  .then(data => {
    // Aquí 'data' es un array de usuarios
    console.log("Lista de usuarios:", data);
  })
  .catch(error => {
    // Capturar errores de red o de la petición
    console.error("Hubo un problema con la petición:", error);
  });


  </script>
  

</body>
</html>

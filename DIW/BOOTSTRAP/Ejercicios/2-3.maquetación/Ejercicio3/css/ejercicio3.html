<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>GRID</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row green">
            <header class="col">
                HEADER
            </header>
        </div> 

        <div class="row"><!--offset significa qued eja X columnas vacías antes del elemento-->
            <div class="col-6 col-sm-3 offset-lg-3 blue">1</div>
            <div class="col-6 col-sm-3 blue">2</div>

            <!--SALTO DE LÍNEA-->
            <div class="w-100 d-none d-lg-block"></div>

            <div class="col-6 col-sm-3 blue">3</div>

            <div class="col-6 col-sm-3 offset-lg-6 blue">4</div>
        </div>
        
        <div class="row cyan">
            <div class="col-12 d-none d-sm-block d-lg-none"><!--En las pantallas pequeñas d-none (inicialmente no aparece) en las pantallas sm aparece y en las lg no aparece-->
                Tablet
            </div>
        </div>

        <div class="row grey">
            <div class="col-6 col-sm-3 order-lg-4">a</div>
            <div class="col-6 col-sm-3 order-lg-3">b</div>
            <div class="col-6 col-sm-3 order-lg-2">c</div>
            <div class="col-6 col-sm-3 order-lg-1">d</div>
        </div>
        
        <div class="row cyan">
            <div class="col-12 d-sm-none">
                Mobile
            </div>
        </div>

        <div class="row cyan">
            <div class="col-12 d-none d-lg-block">
                Desktop
            </div>
        </div>
        
        <div class="row"><!--CARITAS-->
            <div class="col col-sm-6 col-lg-3 offset-lg-3 d-none d-sm-block salmon">:(</div>
            <div class="col col-sm-6 col-lg-3 salmon">:D</div>
            <div class="col-lg-3"></div>
        </div>

        <footer class="row green">
            <div class="col">
                FOOTER
            </div>
        </footer>
    </div>
</body>
</html>
